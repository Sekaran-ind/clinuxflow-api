        uiComponent: "TextInput"
      - id: "hours_close"
        path: "Location.hoursOfOperation.closingTime"
        label: "Closing Time"
        uiComponent: "TextInput"
      - id: "hours_allday"
        path: "Location.hoursOfOperation.allDay"
        label: "Open All Day"
        uiComponent: "Checkbox"

  - resourceType: Consent
    id: section_consent
    label: "Consent Details"
    repeats: true
    fields:
      - id: "consent_title"
        path: "Consent.sourceAttachment.title"
        label: "Title"
        uiComponent: "TextInput"
      - id: "consent_category"
        path: "Consent.category"
        label: "Consent Type"
        uiComponent: "Dropdown"
        choices: ["HIPAA Privacy Notice","Informed Consent for Treatment","Financial Responsibility","Telemedicine Consent","Photography / Research","Minor Treatment Consent"]
        required: true
      - id: "consent_status"
        path: "Consent.status"
        label: "Status"
        uiComponent: "Dropdown"
        choices: ["draft","active","inactive","entered-in-error","rejected"]
      - id: "consent_datetime"
        path: "Consent.dateTime"
        label: "Date Signed"
        uiComponent: "DatePicker"
      - id: "consent_expiry"
        path: "Consent.provision.period.end"
        label: "Expiry Date"
        uiComponent: "DatePicker"

  # SPEC-24 §7 step 6 (Affiliate Organization) — genuinely new: an organization-to-organization
  # relationship (a partner imaging centre/lab/billing service delivering a shared service to/
  # through this facility), profiled as ClinuxFlowAffiliateOrganization (data/structure-
  # definitions), FHIR R4's own OrganizationAffiliation resource, not a repurposed Organization.
  # Distinct from section_staff_role's affiliate case (ClinuxFlowAffiliatePractitionerRole,
  # captured entirely outside this YAML — see TeamSettingsModal.vue's Affiliates tab): that one is
  # a practitioner-level, account-linking relationship; this one is org-level and admin-configured,
  # same tier as Services/Hours/Consents above.
  #
  # `participatingOrganization` deliberately captured as a plain string (no target resource — an
  # external affiliate org has no reason to conform to this app's own Facility profile, same
  # reasoning ClinuxFlowAffiliateOrganization.json's own comment gives), same simplification the
  # WHOLE compiler pipeline already uses for every Reference/CodeableConcept leaf (a bare value,
  # not a real {reference,display}/{coding,text} object) — confirmed via the generated dictionary
  # (data/form-schematics.schema.json): '.participatingOrganization.display' is NOT a recognized
  # path (Reference is treated as opaque/unwalked here, unlike identifier's own richer sub-tree),
  # only the bare '.participatingOrganization' path is. `.code`/`.specialty` map straight to their
  # real CodeableConcept-array paths — MultiSelect's own multi-answer handling (local-extractor
  # .js's dynamicArrayIndexTrackingLedger) gives each its own array slot, matching HealthcareService
  # .category's precedent above.
  #
  # `.healthcareService` (which of THIS facility's own HealthcareService entries the affiliate
  # fulfills — a real Reference, per the StructureDefinition) has NO field here: it would need a
  # genuine cross-group-instance reference-picker this compiler has no mechanism for yet (unlike
  # the auto-linked 1:1 references such as PractitionerRole.organization) — left deliberately
  # uncaptured rather than faked with a free-text field that isn't really a Reference. Same
  # honesty as Provider's own deferred telecom/identifier-slicing gap.
  - resourceType: OrganizationAffiliation
    id: section_affiliate_organization
    label: "Affiliate Organization"
    repeats: true
    fields:
      - id: "affiliate_org_name"
        path: "OrganizationAffiliation.participatingOrganization"
        label: "Partner Organization Name"
        description: "The affiliate/partner organization providing the service (e.g. an external diagnostic lab chain)."
        uiComponent: "TextInput"
        required: true
      - id: "affiliate_org_relationship"
        path: "OrganizationAffiliation.code"
        label: "Relationship"
        description: "The nature of the affiliation."
        uiComponent: "MultiSelect"
        choices: ["Provider", "Diagnostics", "Billing", "Shared Imaging Service", "Laboratory", "Pharmacy"]
        required: true
      - id: "affiliate_org_specialty"
        path: "OrganizationAffiliation.specialty"
        label: "Specialty (if clinical)"
        uiComponent: "MultiSelect"
        choices: ["Cardiology", "Neurology", "Radiology", "Pediatrics", "Orthopedics", "Dermatology", "General Medicine", "ENT", "Ophthalmology", "Psychiatry"]
      - id: "affiliate_org_phone"
        path: "OrganizationAffiliation.telecom.value"
        label: "Phone"
        uiComponent: "TextInput"
      - id: "affiliate_org_email"
        path: "OrganizationAffiliation.telecom.value"
        label: "Email"
        uiComponent: "TextInput"
      - id: "affiliate_org_active"
        path: "OrganizationAffiliation.active"
        label: "Active"
        uiComponent: "Checkbox"

  - resourceType: Appointment
    id: section_appointment
    label: "Appointment Details"
    repeats: true
    fields:
      - id: "appt_patient"
        path: "Appointment.participant.actor"
        label: "Patient"
        uiComponent: "TextInput"
      - id: "appt_staff"
        path: "Appointment.participant.actor"
        label: "Staff Member"
        uiComponent: "TextInput"
      - id: "appt_status"
        path: "Appointment.status"
        label: "Status"
        uiComponent: "Dropdown"
        choices: ["proposed","booked","arrived","fulfilled","cancelled","noshow"]
        required: true
      - id: "appt_start"
        path: "Appointment.start"
        label: "Start Time"
        uiComponent: "TextInput"
      - id: "appt_end"
        path: "Appointment.end"
        label: "End Time"
        uiComponent: "TextInput"
      - id: "appt_description"
        path: "Appointment.description"
        label: "Reason / Notes"
        uiComponent: "TextInput"
