        label: "Public Email"
        uiComponent: "TextInput"
      # Real spec gap found live (NHPR "Register Professional" API, registrationAcademic block) —
      # nothing in this app ever captured a practitioner's actual qualifications/registrations;
      # only a single free-text staff_qualification string existed. A genuine NESTED repeating
      # group (type: "group", yaml-to-questionnaire.js's own recursive field-group support) —
      # deliberately nested INSIDE section_staff, not a sibling top-level block: local-extractor.js
      # resolves a leaf's resource-instance purely by the nearest ENCLOSING 'separate-instances'
      # frame in its group stack, and a sibling top-level block has NO such frame of its own here
      # (all its fields map to the identical bare Practitioner.extension path, which the mode-
      # detection heuristic reads as one converging array field, not per-repetition instances) —
      # confirmed live: a sibling-block version silently produced a SEPARATE, orphaned Practitioner
      # resource with no name/identity, never merged with the real one. Nesting here means every
      # qualification's extensions correctly land on THIS SAME repetition's own Practitioner
      # resource. One entry per (council registration + the degree that qualifies for it) — the
      # real spec nests `qualifications[]` INSIDE each `registrationData[]` entry; modeled here as
      # one combined entry per pair rather than a doubly-nested repeating array, a deliberate
      # simplification given no UI precedent exists yet for that depth.
      - id: "section_staff_qualification"
        type: "group"
        path: "Practitioner.qualification"
        label: "Qualification & Registration"
        repeats: true
        fields:
          # Real degree-code table, verbatim from the NHPR spec's own
          # "register/update professional api" qualification table — not invented. The one field
          # in this group with a genuine direct FHIR mapping (Practitioner.qualification.code, the
          # same real base element staff_qualification above already uses) — extensions below it
          # are for the spec fields that truly have none.
          - id: "staff_qual_degree_code"
            path: "Practitioner.qualification.code"
            label: "Degree / Diploma Obtained"
            uiComponent: "Dropdown"
            choices: ["4060 - MBBS (Modern Medicine)","4074 - BDS (Dentistry)","4079 - BAMS (Ayurvedic)","4082 - BUMS (Unani)","61 - BSMS (Siddha)","74 - BTMS (Sowa-Rigpa)","40 - BHMS (Homoeopathy)"]
            required: true
          # Real bug found live (and fixed, not just noted): every field below this comment used
          # to declare path: "Practitioner.extension" (bare) — but local-extractor.js's own
          # _navigateToWriteTarget unconditionally consumes THIS GROUP's own token-length from
          # EVERY enclosed leaf's path before writing (it has no per-leaf awareness, only a
          # per-frame one) — since this group's own frame consumes exactly 1 token
          # ("qualification"), a bare 1-token "extension" path had NOTHING left to write after
          # that consumption, and the value was silently lost. Confirmed empirically (a live
          # extraction test, not assumed): every one of these fields vanished entirely, not even
          # landing on the wrong resource. The real fix is for a leaf's OWN path to correctly
          # extend the group's own prefix — Practitioner.qualification.extension, a real, valid
          # FHIR shape (any BackboneElement, qualification included, may carry its own .extension
          # array) — so the remaining ".extension" segment resolves against the SAME
          # qualification[N] entry staff_qual_degree_code (Practitioner.qualification.code, a
          # sibling field) already writes into, not the Practitioner's own top-level extension
          # array.
          - id: "staff_qual_country"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-country"
            label: "Country"
            uiComponent: "TextInput"
          - id: "staff_qual_state"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-state"
            label: "State (LGD)"
            uiComponent: "TextInput"
          # No college/university master data exists anywhere in this codebase yet (confirmed —
          # neither clinuxflow-abdm-gateway nor clinuxflow-api has a route or data file for
          # either) — honest free-text capture rather than a fabricated dropdown; becomes a real
          # Dropdown once that master data is wired up.
          - id: "staff_qual_college"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-college"
            label: "College"
            uiComponent: "TextInput"
          - id: "staff_qual_university"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-university"
            label: "University"
            uiComponent: "TextInput"
          - id: "staff_qual_year_awarded"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-year-awarded"
            label: "Year of Awarding"
            uiComponent: "TextInput"
          - id: "staff_qual_degree_certificate"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-degree-certificate"
            label: "Degree Certificate (base64)"
            uiComponent: "TextInput"
          # NHPR user manual's own Step 16 — asked once per document (degree here, registration
          # certificate below): "Is your name in the [degree] the same as your name in Aadhaar?" If
          # No, a name-change affidavit (or equivalent) attachment is required — enforced in the UI.
          - id: "staff_qual_degree_name_matches_aadhaar"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-degree-name-matches-aadhaar"
            label: "Is your name in the Degree Certificate the same as in Aadhaar?"
            uiComponent: "Dropdown"
            choices: ["Yes","No"]
          - id: "staff_qual_degree_name_change_affidavit"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-degree-name-change-affidavit"
            label: "Name Change Affidavit for Degree Certificate (base64, if name differs)"
            uiComponent: "TextInput"
          # Registration-with-council half of the same real spec block (registrationAcademic.
          # registrationData) — registeredWithCouncil reuses the SAME master data the Create HPR
          # ID step's /hpr/master/medical-councils route already serves (closest real master list
          # available; the spec gives no separate council table for this step).
          - id: "staff_qual_registered_council"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-council"
            label: "Registered With Council (HPR master: medical-councils)"
            uiComponent: "TextInput"
            required: true
          - id: "staff_qual_registration_number"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-registration-number"
            label: "Registration Number"
            uiComponent: "TextInput"
            required: true
          - id: "staff_qual_registration_date"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-registration-date"
            label: "Registration Date"
            uiComponent: "TextInput"
          - id: "staff_qual_registration_certificate"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-registration-certificate"
            label: "Registration Certificate (base64)"
            uiComponent: "TextInput"
          - id: "staff_qual_registration_name_matches_aadhaar"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-registration-name-matches-aadhaar"
            label: "Is your name in the Registration Certificate the same as in Aadhaar?"
            uiComponent: "Dropdown"
            choices: ["Yes","No"]
          - id: "staff_qual_registration_name_change_affidavit"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-registration-name-change-affidavit"
            label: "Name Change Affidavit for Registration Certificate (base64, if name differs)"
            uiComponent: "TextInput"
          - id: "staff_qual_permanent_or_renewable"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-permanent-or-renewable"
            label: "Permanent or Renewable"
            uiComponent: "Dropdown"
            choices: ["Permanent","Renewable"]
          # Mandatory only "if isPermanentOrRenewable is Renewable" per the real spec's own note —
          # enforced in the UI, not the compiler (no conditional-required primitive exists here yet).
          - id: "staff_qual_renewable_due_date"
            path: "Practitioner.qualification.extension"
            extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-qualification-renewable-due-date"
            label: "Renewable Due Date"
            uiComponent: "TextInput"
      # Real spec gap found live (NHPR "Register Professional" API, currentWorkDetails block) —
      # deliberately PLAIN fields, not a nested group like qualification above: work experience is
      # a SINGLE (non-repeating) declaration, with no natural backbone sub-element to nest under,
      # so a nested-group wrapper adds real complexity (and, confirmed empirically, real risk —
      # see the git history of this exact block for the two ways that went wrong) for zero benefit
      # over plain sibling fields, which already correctly resolve to the SAME enclosing
      # Practitioner instance section_staff's own fields do (same proven mechanism staff_hp_
      # category_code etc. already use, no group-nesting needed for a non-repeating single value).
      - id: "staff_work_currently_working"
        path: "Practitioner.extension"
        extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-work-currently-working"
        label: "Currently Working"
        uiComponent: "Checkbox"
      # NHPR user manual's own "Nature of Work" — a real multi-select ("He/She can select multiple
      # options in Nature of work"), widened from the earlier single Dropdown to match. Still the
      # same real currentWorkDetails.purposeOfRegistration field (ClinuxFlowProvider.json's own
      # :workPurpose comment) — abdmAdapter.js's buildPractitionerPayload joins the selections back
      # into one string, since the real API's own singular/array shape isn't independently
      # confirmed.
      - id: "staff_work_purpose"
        path: "Practitioner.extension"
        extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-work-purpose"
        label: "Nature of Work"
        uiComponent: "MultiSelect"
        choices: ["Practice","Administrative","Teaching","Teleconsultation"]
      # Shown alongside Nature of Work in the manual — relevant when Teleconsultation is selected
      # above; enforced as relevant-not-required in the UI, not here.
      - id: "staff_work_teleconsultation_url"
        path: "Practitioner.extension"
        extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-work-teleconsultation-url"
        label: "Teleconsultation URL"
        uiComponent: "TextInput"
      - id: "staff_work_status"
        path: "Practitioner.extension"
        extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-work-status"
        label: "Work Status"
        uiComponent: "Dropdown"
        choices: ["Private","Government","Both"]
      # Mandatory only "if currentlyWorking is 0" per the real spec's own note — enforced in the
      # UI, not the compiler.
      - id: "staff_work_reason_not_working"
        path: "Practitioner.extension"
        extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-work-reason-not-working"
        label: "Reason for Not Working"
        uiComponent: "TextInput"
      # Search Facility is now real — ProviderWorkExperienceHost.vue's own "Search Facility" panel
      # (reusing the already-built, already-verified /hfr/facility/search gateway route) lets a
      # practitioner pick a real ABDM-registered facility instead of typing its name blind;
      # staff_work_facility_id carries that facility's own real ABDM Facility ID once picked (the
      # spec's own facilityId, which per its own note makes facilityName/address/pincode/type
      # optional — the practitioner can still edit them, this just adds the real linkage on top).
      - id: "staff_work_facility_id"
        path: "Practitioner.extension"
        extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-work-facility-id"
        label: "ABDM Facility ID (from Search Facility)"
        uiComponent: "TextInput"
      - id: "staff_work_facility_name"
        path: "Practitioner.extension"
