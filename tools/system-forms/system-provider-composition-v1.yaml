      - id: "staff_work_facility_address"
        path: "Practitioner.extension"
        extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-work-facility-address"
        label: "Facility Address"
        uiComponent: "TextInput"
      - id: "staff_work_facility_pincode"
        path: "Practitioner.extension"
        extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-work-facility-pincode"
        label: "Facility Pincode"
        uiComponent: "TextInput"
      - id: "staff_work_facility_type"
        path: "Practitioner.extension"
        extensionUrl: "https://clinuxflow.example/fhir/StructureDefinition/hpr-work-facility-type"
