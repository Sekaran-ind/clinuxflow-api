      # NHPR user manual's own Preview Profile step (page 16-17) — reviewed just before Attestation
      # & e-Sign, not part of any of the 3 capture tree elements above (Personal Details/
      # Qualifications/Work Experience). No confirmed real ABDM API field for either — same honest-
      # gap treatment ClinuxFlowProvider.json's own :about/:assistedRegistration comments carry.
      - id: "staff_about"
        path: "Practitioner.extension"
