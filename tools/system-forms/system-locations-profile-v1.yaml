formId: system-locations-profile-v1
title: "Locations"
composition:
  - resourceType: Location
    id: section_location
    label: "Location Details"
    fields:
      - id: "location_name"
        path: "Location.name"
        label: "Branch Name"
        uiComponent: "TextInput"
        required: true
      - id: "location_address"
        path: "Location.address.text"
        label: "Address"
        uiComponent: "TextInput"
      - id: "location_phone"
        path: "Location.telecom.value"
        label: "Phone"
        uiComponent: "TextInput"
