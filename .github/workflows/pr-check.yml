name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # yaml-to-questionnaire.test.js exercises the real compiled data/graphs.bundle.json,
      # not a mock of it — must run before npm test.
      - run: npm run build:kernel

      - run: npm test
