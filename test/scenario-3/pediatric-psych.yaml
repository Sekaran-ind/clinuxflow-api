formId: pediatric-behavioral-review-v1
title: "Pediatric Neurodevelopmental Clinical Assessment Layout"
composition:
  - resourceType: Condition
    id: section_behavioral_dx
    label: "1. Clinical Neurodevelopmental Diagnostic Profile"
    fields:
      - id: "behavioral_diagnosis"
        path: "Condition.clinicalStatus.coding.code"
        label: "Primary Neurodevelopmental Condition Mapping"
        uiComponent: "Autocomplete"
        valueSetUrl: "https://nih.gov"
  - resourceType: Observation
    id: section_cognitive_vitals
    label: "2. Academic & Behavioral Function Matrix"
    itemControl: "gtable"
    repeats: true
    fields:
      - id: "attention_span_score"
        path: "Observation.component.valueQuantity.value"
        label: "Attention Span Standard Rating"
        uiComponent: "NumericInput"
        unit: "score"
      - id: "hyperactivity_score"
        path: "Observation.component.valueQuantity.value"
        label: "Hyperactivity Behavioral Rating"
        uiComponent: "NumericInput"
        unit: "score"
  - resourceType: MedicationRequest
    id: section_neuro_meds
    label: "3. Central Nervous System Pharmacotherapy"
    fields:
      - id: "stimulant_search"
        path: "MedicationRequest.medicationCodeableConcept.coding.code"
        label: "Prescribed Central Nervous System Stimulant Medication"
        uiComponent: "Autocomplete"
        valueSetUrl: "https://nih.gov"
